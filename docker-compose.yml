version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraperdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A workers.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://scraper:scraper@postgres:5432/scraperdb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=changeme
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  api:
    build: .
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://scraper:scraper@postgres:5432/scraperdb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=changeme
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  pg_data:
